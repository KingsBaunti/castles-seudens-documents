#Запуск - docker-compose up -d
#Стоп - docker-compose down


#Последняя верссия
version: '3.8'

services:

  postgres:

    image: postgres:16
    container_name: test_students_documents_project_postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb

      #порты в формате "порт хоста:порт контейнера"
      #при пооддлючении к localhost:8080 попадаем в PostgresSQL внутри контейнера на порту 8080
    ports:
      - "5434:5432"

      #Тома (volumes) для сохранения данных, без него при удалении контейнера все данные в БД будут утеряны
      #postgres_data - именованный том с привязкой к папке в контейнере
    volumes:
      - postgres_data:/var/lib/postgresql/data

    #проверка здоровья проверяет что контейнер запущен и БД готова к работе
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "test", "-d", "testdb" ]
      interval: 30s
      timeout: 10s
      retries: 3


volumes:
  postgres_data: