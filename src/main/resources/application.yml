# настройка подключения к базе данных
spring:
  datasource:
    #ссылка на БД в контейнере
    url: jdbc:postgresql://localhost:5432/saga_main_bd
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:

    hibernate:
      #validate - проверяет наличие таблиц и их колонки
      #update - дополняет но не удаляет
      #create-drop
      ddl-auto: create-drop
    #SQL в логах
    show-sql: true

    properties:
      #Диалект с уточнением базы данных
      dialect: org.hibernate.dialect.PostgreSQLDialect
      #Формат SQL в логах
      format_sql: true

logging:
  level:
    com.castles.admanager.core: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.hibernate.orm.results.bind: trace