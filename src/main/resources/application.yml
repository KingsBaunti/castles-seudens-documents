# настройка подключения к базе данных
spring:
  datasource:
    #ссылка на БД в контейнере
    url: jdbc:postgresql://localhost:5433/students_documents_bd
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:

    hibernate:
      #validate - проверяет наличие таблиц и их колонки
      #update - дополняет но не удаляет
      #create-drop
      ddl-auto: validate
    #SQL в логах
    show-sql: true

    properties:
      hibernate:
        batch_size: 100
        order_updates: true
      order_inserts: true
      jdbc.batch_versioned_data: true
      #Диалект с уточнением базы данных
      dialect: org.hibernate.dialect.PostgreSQLDialect
      #Формат SQL в логах
      format_sql: true


logging:
  level:
    #Для написанного кода логирование максимальное
    com.castles.seudensdocuments.core: INFO
    #В логах отображаем информацию о обработке спрингом HHTP запросов
    org.springframework.web: WARN
    #Отображаем в логах SQL запросы к БД
    org.hibernate.SQL: WARN
    #В SQL запросах к БД подставляем реальные значения вместо "?"
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.hibernate.orm.jdbc.bind: WARN
    #Отображаем в логах подробно результат мапинга из БД
    org.hibernate.orm.results.bind: WARN
    #Отображаем в логах ResultSet
    org.hibernate.orm.jdbc.extract: WARN

